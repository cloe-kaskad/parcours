<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion à ton espace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#59114D}
a{color:#F7BECA;text-decoration:none}a:hover{color:#F5EDE3}
.ls{font-family:'League Spartan',sans-serif}
.dm{font-family:'DM Sans',sans-serif}
.bk{font-family:'Libre Baskerville',serif;font-style:italic}
.in{width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid rgba(245,237,227,.5);outline:0;color:#F5EDE3;font-family:'DM Sans',sans-serif;font-size:18px;padding:10px 0 12px;min-height:44px}
.in::placeholder{color:rgba(245,237,227,.45)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #59114D; color: #F5EDE3; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 28px 40px">

  <img src="../assets/logo-blanc.svg" alt="Blocages &amp; Intuition" style="height: 42px; width: auto; display: block">

  <sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 28px">
      <h1 class="ls" style="font-size: 54px; font-weight: 600; letter-spacing: -0.03em; line-height: .92; color: #F5EDE3; margin: 0">Ton espace t'attend.</h1>
      <label class="dm" style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #F7BECA">ton email<input class="in" type="email" placeholder="prenom@..." autocomplete="email"></label>
      <button class="ls" onClick="{{send}}" style="font-size: 18px; font-weight: 600; background: #E6361D; color: #F5EDE3; border: 0; border-radius: 999px; padding: 16px 24px 14px; min-height: 52px; cursor: pointer; align-self: flex-start">Recevoir mon lien</button>
    </div>
  </sc-if>

  <sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 22px">
      <h1 class="ls" style="font-size: 54px; font-weight: 600; letter-spacing: -0.03em; line-height: .92; color: #F5EDE3; margin: 0">C'est parti.</h1>
      <p class="dm" style="font-size: 17px; line-height: 1.6; color: #F5EDE3; margin: 0">Le lien est dans ta boîte mail. Il t'ouvre ton espace en un geste, pas de mot de passe à retenir.</p>
      <p class="bk" style="font-size: 15px; color: #F7BECA; margin: 0">Rien reçu dans deux minutes ? Regarde les indésirables, ou <a href="#" onClick="{{back}}" style="text-decoration: underline">renvoie-le</a>.</p>
    </div>
  </sc-if>

  <div class="dm" style="font-size: 12px; color: #F5EDE3; opacity: .55">Un espace privé, pour toi seule. Cloé y lit ce que tu lui adresses, rien d'autre.</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    return {
      waiting: !this.state.sent,
      sent: this.state.sent,
      send: () => this.setState({ sent: true }),
      back: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>

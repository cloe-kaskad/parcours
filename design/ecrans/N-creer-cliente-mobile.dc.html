<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Créer une cliente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF6EF}
a{color:#59114D;text-decoration:none}
.ls{font-family:'League Spartan',sans-serif}
.dm{font-family:'DM Sans',sans-serif}
.bk{font-family:'Libre Baskerville',serif;font-style:italic}
.paper{background-image:url(../assets/grain.png);background-repeat:repeat;background-size:240px 240px}
.lab{display:flex;flex-direction:column;gap:6px;font-family:'DM Sans',sans-serif;font-size:12px;color:#59114D}
.in{width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px solid rgba(89,17,77,.4);outline:0;font-family:'DM Sans',sans-serif;font-size:17px;color:#111;padding:8px 0 10px;min-height:44px}
.ta{width:100%;box-sizing:border-box;background:#E8DDD0;border:0;border-radius:6px;outline:0;resize:none;font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.55;color:#111;min-height:120px;padding:14px 16px}
.pick{border:2px solid transparent;border-radius:6px;overflow:hidden;padding:0;background:none;cursor:pointer;height:72px}
.pick.on{border-color:#E6361D}
</style>
</helmet>
<div class="paper" style="width: 390px; min-height: 1300px; box-sizing: border-box; background: #FAF6EF; color: #111; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column">

  <div style="background: #59114D; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center">
    <a href="Agenda.dc.html" class="ls" style="font-size: 14px; font-weight: 600; color: #F5EDE3">← Clientes</a>
    <img src="../assets/logo-blanc.svg" alt="Blocages &amp; Intuition" style="height: 30px; width: auto; display: block">
  </div>

  <div style="padding: 30px 22px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 class="ls" style="font-size: 38px; font-weight: 600; letter-spacing: -0.03em; line-height: .95; color: #59114D; margin: 0">Une nouvelle cliente</h1>
    <div class="bk" style="font-size: 14px; color: #59114D">Son espace existe dès que tu l'as créé. Le lien d'accès, tu l'envoies quand tu veux.</div>
  </div>

  <div style="padding: 30px 22px 0; display: flex; flex-direction: column; gap: 24px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
      <label class="lab">prénom<input class="in" type="text" value="Flora"></label>
      <label class="lab">nom<input class="in" type="text" value="Marchetti"></label>
    </div>
    <label class="lab">email<input class="in" type="email" value="flora@…fr"></label>
    <label class="lab">l'intention du parcours, dans ta voix<textarea class="ta">Ce parcours a été pensé pour t'aider à passer d'un système de dissociation (te couper de ton corps et de tes émotions pour performer) à une spontanéité ancrée.</textarea></label>
    <label class="lab">dossier Drive à relier<input class="in" type="text" value="B&amp;I / Clientes / Flora" placeholder="choisir un dossier"></label>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div class="dm" style="font-size: 12px; color: #59114D">la couverture</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button class="pick on" aria-pressed="true" aria-label="Lumière sur la mer"><img src="../assets/couverture-deborah.jpg" alt="" style="width: 100%; height: 72px; object-fit: cover; display: block"></button>
        <button class="pick" aria-pressed="false" aria-label="Matière chaude"><img src="../assets/vignette-pepin.jpg" alt="" style="width: 100%; height: 72px; object-fit: cover; display: block"></button>
        <button class="pick" aria-pressed="false" aria-label="Lumière de fenêtre"><img src="../assets/vignette-alice-diop.jpg" alt="" style="width: 100%; height: 72px; object-fit: cover; display: block"></button>
        <button class="pick" aria-pressed="false" aria-label="Fil rouge"><img src="../assets/vignette-histoire.jpg" alt="" style="width: 100%; height: 72px; object-fit: cover; display: block"></button>
        <button class="pick" aria-pressed="false" aria-label="Deux cercles"><img src="../assets/vignette-meres.jpg" alt="" style="width: 100%; height: 72px; object-fit: cover; display: block"></button>
        <button class="pick" aria-label="Générer à partir de l'intention" style="background: #E8DDD0; display: flex; align-items: center; justify-content: center; text-align: center"><span class="ls" style="font-size: 12px; font-weight: 600; color: #59114D; line-height: 1.1; padding: 0 6px">Générer à partir de l'intention</span></button>
      </div>
      <div class="dm" style="font-size: 12px; color: #59114D; opacity: .7">Paysage, matière, lumière. Jamais de visage, jamais de photo « business ».</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 10px">
      <button class="ls" style="font-size: 17px; font-weight: 600; background: #E6361D; color: #F5EDE3; border: 0; border-radius: 999px; padding: 15px 24px 13px; min-height: 50px; cursor: pointer; align-self: flex-start">Créer son espace</button>
      <div class="bk" style="font-size: 13px; color: #59114D; opacity: .8">« Lui envoyer son lien d'accès » apparaîtra sur sa fiche, pour quand tu seras prête.</div>
    </div>
  </div>
  <div style="height: 60px"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
